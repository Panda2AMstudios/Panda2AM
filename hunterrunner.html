<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hunter vs. Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin:0;
        background:#05070b;
        color:white;
        font-family:Arial, sans-serif;
        display:flex;
        flex-direction:column;
        align-items:center;
        user-select:none;
        overflow:hidden;
    }
    h1 {
        margin:10px 0 0 0;
        font-size:28px;
        letter-spacing:1px;
    }
    #hud {
        margin-top:8px;
        display:flex;
        gap:25px;
        font-size:16px;
    }
    #hud span.label {
        opacity:0.7;
    }
    #gameWrapper {
        margin-top:10px;
        position:relative;
    }
    canvas {
        border:2px solid #333;
        background:black;
        display:block;
        cursor:crosshair;
    }
    #message {
        margin-top:10px;
        font-size:18px;
        min-height:24px;
        text-align:center;
    }
    #restartBtn {
        margin-top:10px;
        padding:8px 16px;
        border:none;
        border-radius:6px;
        background:#7be0b5;
        color:#000;
        font-weight:bold;
        cursor:pointer;
        display:none;
    }
    #restartBtn:hover {
        filter:brightness(1.1);
    }

    #homeBtn {
        position:fixed;
        top:10px;
        right:10px;
        padding:8px 14px;
        background:#7be0b5;
        color:#000;
        font-weight:bold;
        border:none;
        border-radius:6px;
        cursor:pointer;
        z-index:9999;
    }
    #homeBtn:hover {
        filter:brightness(1.15);
    }
</style>
</head>
<body>

<button id="homeBtn" onclick="window.location.href='index.html'">Return Home</button>

<h1>Hunter vs. Runner</h1>

<div id="hud">
    <div><span class="label">Stage:</span> <span id="stageNum">1</span></div>
    <div><span class="label">Enemies:</span> <span id="enemyCount">0</span></div>
    <div><span class="label">Time:</span> <span id="timeLeft">60</span>s</div>
</div>

<div id="gameWrapper">
    <canvas id="game" width="800" height="450"></canvas>
</div>

<div id="message"></div>
<button id="restartBtn" onclick="startStage(currentStage)">Restart Stage</button>

<script>
/* ============================================================
   CORE CONSTANTS
============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const FOV = Math.PI / 3;
const NUM_RAYS = 300;
const RAY_STEP = FOV / NUM_RAYS;

const FLASHLIGHT_RADIUS = 280; // LARGE HORROR CIRCLE

/* ============================================================
   MOUSE LOCK + MOUSE LOOK
============================================================ */
canvas.addEventListener("click", () => {
    canvas.requestPointerLock();
});

document.addEventListener("mousemove", e => {
    if (document.pointerLockElement === canvas) {
        player.angle += e.movementX * 0.0025;
    }
});

/* ============================================================
   PLAYER
============================================================ */
let player = {
    x: 2.5,
    y: 2.5,
    angle: 0,
    speed: 0.06
};

let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* ============================================================
   MAZE STORAGE
============================================================ */
let MAP = [];
let MAP_W = 24;
let MAP_H = 24;

/* ============================================================
   COLLISION CHECK
============================================================ */
function isWall(x, y) {
    x = Math.floor(x);
    y = Math.floor(y);
    if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return true;
    return MAP[y][x] === 1;
}

/* ============================================================
   PLAYER MOVEMENT
============================================================ */
function updatePlayer() {
    let moveX = 0;
    let moveY = 0;

    if (keys["w"]) {
        moveX += Math.cos(player.angle) * player.speed;
        moveY += Math.sin(player.angle) * player.speed;
    }
    if (keys["s"]) {
        moveX -= Math.cos(player.angle) * player.speed;
        moveY -= Math.sin(player.angle) * player.speed;
    }
    if (keys["a"]) {
        moveX += Math.cos(player.angle - Math.PI/2) * player.speed;
        moveY += Math.sin(player.angle - Math.PI/2) * player.speed;
    }
    if (keys["d"]) {
        moveX += Math.cos(player.angle + Math.PI/2) * player.speed;
        moveY += Math.sin(player.angle + Math.PI/2) * player.speed;
    }

    if (!isWall(player.x + moveX, player.y))
        player.x += moveX;
    if (!isWall(player.x, player.y + moveY))
        player.y += moveY;
}

/* ============================================================
   RAYCASTING
============================================================ */
function castRay(angle) {
    let sin = Math.sin(angle);
    let cos = Math.cos(angle);

    for (let t = 0; t < 20; t += 0.02) {
        let x = player.x + cos * t;
        let y = player.y + sin * t;

        if (isWall(x, y)) {
            return { dist: t, hitX: x, hitY: y };
        }
    }
    return { dist: 20, hitX: player.x, hitY: player.y };
}

/* ============================================================
   DRAW 3D VIEW
============================================================ */
function render3D() {
    ctx.fillStyle = "#0f131a";
    ctx.fillRect(0, 0, W, H/2);

    ctx.fillStyle = "#0a0d12";
    ctx.fillRect(0, H/2, W, H/2);

    let startAngle = player.angle - FOV/2;

    for (let i = 0; i < NUM_RAYS; i++) {
        let rayAngle = startAngle + i * RAY_STEP;
        let ray = castRay(rayAngle);

        let dist = ray.dist * Math.cos(rayAngle - player.angle);
        let wallHeight = Math.min(300, (1 / dist) * 500);

        let shade = Math.max(0.2, 1 - dist / 10);
        ctx.fillStyle = `rgba(58,63,75,${shade})`;

        ctx.fillRect(i * (W / NUM_RAYS), (H/2 - wallHeight/2), (W / NUM_RAYS) + 1, wallHeight);
    }
}

/* ============================================================
   DRAW PIXEL-ART AK (GENERATED IN CODE)
============================================================ */
const akCanvas = document.createElement("canvas");
akCanvas.width = 120;
akCanvas.height = 60;
const akCtx = akCanvas.getContext("2d");

// Draw simple pixel-art AK
function drawAK() {
    akCtx.clearRect(0,0,120,60);

    // Metal (black)
    akCtx.fillStyle = "#1a1a1a";
    akCtx.fillRect(20, 20, 80, 10); // barrel
    akCtx.fillRect(40, 30, 40, 10); // body

    // Wood (brown)
    akCtx.fillStyle = "#8b4a2f";
    akCtx.fillRect(10, 25, 20, 12); // stock
    akCtx.fillRect(80, 25, 20, 12); // handguard

    // Flashlight (gray)
    akCtx.fillStyle = "#cccccc";
    akCtx.fillRect(85, 15, 12, 6);
}
drawAK();

/* ============================================================
   RENDER WEAPON (BOTTOM CENTER)
============================================================ */
function renderWeapon() {
    const weaponX = W/2 - akCanvas.width/2;
    const weaponY = H - akCanvas.height - 10;

    ctx.drawImage(akCanvas, weaponX, weaponY);
}

/* ============================================================
   FLASHLIGHT MASK
============================================================ */
function renderFlashlightMask() {
    ctx.save();
    ctx.globalCompositeOperation = "destination-in";

    ctx.beginPath();
    ctx.arc(W/2, H/2, FLASHLIGHT_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

/* ============================================================
   LINE OF SIGHT CHECK
============================================================ */
function hasLineOfSight(x1, y1, x2, y2) {
    let dx = x2 - x1;
    let dy = y2 - y1;
    let dist = Math.sqrt(dx*dx + dy*dy);
    let steps = dist / 0.1;

    let angle = Math.atan2(dy, dx);

    for (let i = 0; i < steps; i++) {
        let tx = x1 + Math.cos(angle) * (i * 0.1);
        let ty = y1 + Math.sin(angle) * (i * 0.1);
        if (isWall(tx, ty)) return false;
    }
    return true;
}

/* ============================================================
   ENEMY SYSTEM
============================================================ */
let enemies = [];
let bullets = [];
let currentStage = 1;
let timeLeft = 60;
let stageActive = false;

function spawnEnemies(count) {
    enemies = [];
    for (let i = 0; i < count; i++) {
        let ex, ey;
        do {
            ex = Math.floor(Math.random() * MAP_W);
            ey = Math.floor(Math.random() * MAP_H);
        } while (MAP[ey][ex] === 1 || (Math.abs(ex - player.x) < 3));

        enemies.push({
            x: ex + 0.5,
            y: ey + 0.5,
            speed: 0.03 + currentStage * 0.005,
            panic: false,
            panicTimer: 0
        });
    }
}

/* Enemy AI */
function updateEnemies() {
    enemies.forEach(e => {
        let dx = player.x - e.x;
        let dy = player.y - e.y;

        // Flashlight panic
        if (hasLineOfSight(e.x, e.y, player.x, player.y)) {
            let angleToPlayer = Math.atan2(dy, dx);
            let diff = Math.abs(((angleToPlayer - player.angle + Math.PI*3) % (Math.PI*2)) - Math.PI);

            if (diff < Math.PI / 6) { // inside flashlight cone
                e.panic = true;
                e.panicTimer = 60;
            }
        }

        if (e.panic) {
            // Run away from player
            let angle = Math.atan2(-dy, -dx);
            e.x += Math.cos(angle) * e.speed * 2;
            e.y += Math.sin(angle) * e.speed * 2;

            e.panicTimer--;
            if (e.panicTimer <= 0) e.panic = false;
        } else {
            // Wander
            let angle = Math.random() * Math.PI * 2;
            e.x += Math.cos(angle) * e.speed * 0.3;
            e.y += Math.sin(angle) * e.speed * 0.3;
        }

        // Wall collision
        if (isWall(e.x, e.y)) {
            e.x -= Math.cos(e.angle) * e.speed;
            e.y -= Math.sin(e.angle) * e.speed;
        }
    });

    enemies = enemies.filter(e => !e.dead);
}

/* ============================================================
   SHOOTING SYSTEM
============================================================ */
document.addEventListener("click", shoot);

function shoot() {
    if (!stageActive) return;

    // Barrel position relative to screen
    const barrelX = W/2 + 40; 
    const barrelY = H - 80;

    bullets.push({
        x: player.x,
        y: player.y,
        angle: player.angle,
        speed: 0.2
    });
}

function updateBullets() {
    bullets.forEach(b => {
        b.x += Math.cos(b.angle) * b.speed;
        b.y += Math.sin(b.angle) * b.speed;

        if (isWall(b.x, b.y)) b.dead = true;

        enemies.forEach(e => {
            let dx = e.x - b.x;
            let dy = e.y - b.y;
            if (dx*dx + dy*dy < 0.2) {
                e.dead = true;
                b.dead = true;
            }
        });
    });

    bullets = bullets.filter(b => !b.dead);
}

/* ============================================================
   ENEMY RENDERING (only if visible)
============================================================ */
function renderEnemies() {
    enemies.forEach(e => {
        if (!hasLineOfSight(player.x, player.y, e.x, e.y)) return;

        let dx = e.x - player.x;
        let dy = e.y - player.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        let angle = Math.atan2(dy, dx) - player.angle;
        angle = ((angle + Math.PI*3) % (Math.PI*2)) - Math.PI;

        if (Math.abs(angle) > FOV/2) return;

        let size = Math.min(200, 300 / dist);
        let x = (angle + FOV/2) * (W / FOV) - size/2;
        let y = H/2 - size/2;

        ctx.fillStyle = e.panic ? "#ff5555" : "#55aaff";
        ctx.fillRect(x, y, size, size);
    });
}

/* ============================================================
   MAZE GENERATOR
============================================================ */
function generateMaze() {
    MAP = [];
    for (let y = 0; y < MAP_H; y++) {
        MAP[y] = [];
        for (let x = 0; x < MAP_W; x++) {
            MAP[y][x] = 1;
        }
    }

    function carve(x, y) {
        const dirs = [
            [1,0], [-1,0], [0,1], [0,-1]
        ].sort(() => Math.random() - 0.5);

        dirs.forEach(([dx, dy]) => {
            let nx = x + dx*2;
            let ny = y + dy*2;
            if (nx > 1 && ny > 1 && nx < MAP_W-1 && ny < MAP_H-1) {
                if (MAP[ny][nx] === 1) {
                    MAP[y + dy][x + dx] = 0;
                    MAP[ny][nx] = 0;
                    carve(nx, ny);
                }
            }
        });
    }

    MAP[2][2] = 0;
    carve(2, 2);
}

/* ============================================================
   STAGE SYSTEM
============================================================ */
function startStage(stage) {
    currentStage = stage;
    document.getElementById("stageNum").textContent = stage;

    generateMaze();

    player.x = 2.5;
    player.y = 2.5;
    player.angle = 0;

    let enemyCount = 3 + stage * 2;
    spawnEnemies(enemyCount);
    document.getElementById("enemyCount").textContent = enemyCount;

    timeLeft = 60 - stage * 3;
    if (timeLeft < 20) timeLeft = 20;
    document.getElementById("timeLeft").textContent = timeLeft;

    stageActive = true;
    document.getElementById("message").textContent = "";
    document.getElementById("restartBtn").style.display = "none";
}

/* ============================================================
   TIMER
============================================================ */
setInterval(() => {
    if (!stageActive) return;

    timeLeft--;
    document.getElementById("timeLeft").textContent = timeLeft;

    if (timeLeft <= 0) {
        stageActive = false;
        document.getElementById("message").textContent = "Time's up! You lose.";
        document.getElementById("restartBtn").style.display = "block";
    }
}, 1000);

/* ============================================================
   MAIN GAME LOOP
============================================================ */
function gameLoop() {
    if (stageActive) {
        updatePlayer();
        updateEnemies();
        updateBullets();
    }

    render3D();
    renderEnemies();
    renderWeapon();
    renderFlashlightMask();

    if (stageActive && enemies.length === 0) {
        stageActive = false;

        if (currentStage === 10) {
            document.getElementById("message").textContent = "YOU BEAT ALL 10 STAGES!";
        } else {
            document.getElementById("message").textContent = "Stage Complete!";
            setTimeout(() => startStage(currentStage + 1), 2000);
        }
    }

    requestAnimationFrame(gameLoop);
}

startStage(1);
gameLoop();

</script>
</body>
</html>
